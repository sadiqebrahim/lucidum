<!doctype html>
<html lang="{{ site.lang }}">
<head>
{% include head.html %}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Lucidum, home">
      <img src="{{ '/assets/img/eyes.png' | relative_url }}" alt="" width="60" height="28">
      <span class="wordmark">LUCIDUM</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Articles</a>
      <a href="{{ '/second-look/' | relative_url }}"{% if page.url == "/second-look/" %} aria-current="page"{% endif %}>Second Look</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == "/about/" %} aria-current="page"{% endif %}>About</a>
      <button class="theme-toggle" type="button" aria-label="Switch colour theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span>Dark</span>
      </button>
    </nav>
  </div>
</header>
<main id="main">
{{ content }}
</main>
<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <p class="motto">{{ site.tagline }}</p>
    <p class="label">
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      {%- if site.instagram != "" %} · <a href="https://www.instagram.com/{{ site.instagram }}/">Instagram</a>{% endif %}
      · Narration on our Reels is AI-generated
    </p>
  </div>
</footer>
<script>
(function () {
  var root = document.documentElement, btn = document.querySelector(".theme-toggle");
  if (!btn) return;
  var sun = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  var moon = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
  function paint() {
    var dark = root.getAttribute("data-theme") === "dark";
    btn.querySelector("svg").innerHTML = dark ? sun : moon;
    btn.querySelector("span").textContent = dark ? "Light" : "Dark";
  }
  btn.addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("lucidum-theme", next); } catch (e) {}
    paint();
  });
  paint();
})();
</script>
</body>
</html>
